[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rakho"
version = "0.1.0"
description = "Agent memory that inspects before it keeps, and can prove what it forgot."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rakho" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.2"]
sluice = ["sluice-taint>=0.4"]

[project.scripts]
rakho = "rakho.cli:main"
rakho-mcp = "rakho.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
